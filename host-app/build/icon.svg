<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Craftparty app icon. Original artwork in the app's own palette (see
    host-app/renderer/style.css) — deliberately not Minecraft's block or
    any other Mojang asset, which Craftparty has no licence to and
    disclaims association with.

    Source of truth: this file. host-app/build/icon.png is rendered from
    it, and electron-builder derives the .ico and .icns from that.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fbde6"/>
      <stop offset="0.62" stop-color="#a5d9f2"/>
      <stop offset="1" stop-color="#c9e8ee"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="1024" height="1024" rx="184" ry="184"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1024" height="1024" fill="url(#sky)"/>

    <g transform="translate(512 560) scale(1.12) translate(-512 -560)">
    <!-- the block: a chunky isometric cube, grass on top, dirt below -->
    <g>
      <!-- soft ground shadow keeps it from floating -->
      <ellipse cx="512" cy="872" rx="235" ry="46" fill="#2f5f16" opacity="0.16"/>

      <!-- top face -->
      <path d="M512 292 L774 444 L512 596 L250 444 Z" fill="#7ec850"/>
      <path d="M512 292 L774 444 L512 596 L250 444 Z" fill="none" stroke="#58a62c" stroke-width="18" stroke-linejoin="round"/>
      <!-- a couple of grass tufts, big enough to survive downscaling -->
      <path d="M348 470 L394 443 L440 470 L394 497 Z" fill="#6fbe45"/>
      <path d="M584 476 L630 449 L676 476 L630 503 Z" fill="#6fbe45"/>

      <!-- left face: grass lip over dirt -->
      <path d="M250 444 L512 596 L512 856 L250 704 Z" fill="#8a5f3c"/>
      <path d="M250 444 L512 596 L512 664 L250 512 Z" fill="#58a62c"/>

      <!-- right face: same, in shade -->
      <path d="M774 444 L774 704 L512 856 L512 596 Z" fill="#6b4529"/>
      <path d="M774 444 L774 512 L512 664 L512 596 Z" fill="#47881f"/>
    </g>

    <!-- party hat, sitting on the block -->
    <g transform="rotate(-9 512 430)">
      <path d="M512 196 L620 430 L404 430 Z" fill="#ffaa2b"/>
      <path d="M512 196 L556 292 L468 292 Z" fill="#ffc76b"/>
      <path d="M446 344 L578 344 L598 388 L426 388 Z" fill="#fffdf5"/>
      <circle cx="512" cy="182" r="44" fill="#fffdf5"/>
    </g>
    </g>

    <!-- confetti -->
    <rect x="176" y="212" width="62" height="62" rx="8" fill="#fffdf5" transform="rotate(-18 207 243)"/>
    <rect x="786" y="176" width="62" height="62" rx="8" fill="#ffaa2b" transform="rotate(24 817 207)"/>
    <rect x="822" y="360" width="52" height="52" rx="8" fill="#fffdf5" transform="rotate(-14 848 386)"/>
    <rect x="150" y="404" width="52" height="52" rx="8" fill="#c94f42" transform="rotate(28 176 430)"/>
  </g>
</svg>
